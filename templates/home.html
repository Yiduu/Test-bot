<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ትንሣኤ ጥያቄ – የመጽሐፍ ቅዱስ ፈተና</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0b2b1f 0%, #1a3f2c 100%);
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans Ethiopic', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* Glassmorphism container */
        .hero {
            max-width: 900px;
            width: 100%;
            background: rgba(10, 25, 20, 0.65);
            backdrop-filter: blur(14px);
            border-radius: 56px;
            padding: 2.5rem 2rem;
            text-align: center;
            border: 1px solid rgba(255, 217, 102, 0.5);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        /* Logo / icon */
        .logo-icon {
            width: 100px;
            height: 100px;
            background: #FFD966;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem;
            font-size: 3.8rem;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #FFD966;
            font-size: 2.6rem;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .sub {
            color: #e6e6e6;
            font-size: 1.1rem;
            border-bottom: 2px solid #FFD966;
            display: inline-block;
            padding-bottom: 8px;
            margin-bottom: 2.5rem;
            opacity: 0.95;
        }

        /* Stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.8rem;
            margin: 2.5rem 0;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.45);
            border-radius: 32px;
            padding: 1.5rem 0.8rem;
            transition: transform 0.2s, background 0.2s;
            border: 1px solid rgba(255, 217, 102, 0.3);
        }

        .stat-card:hover {
            transform: translateY(-6px);
            background: rgba(0, 0, 0, 0.6);
            border-color: #FFD966;
        }

        .stat-number {
            font-size: 2.8rem;
            font-weight: 800;
            color: #FFD966;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #f0f0f0;
            opacity: 0.85;
            margin-top: 8px;
        }

        /* Winner section */
        .winner-section {
            background: rgba(255, 217, 102, 0.12);
            border-radius: 60px;
            padding: 0.8rem 1.5rem;
            display: inline-block;
            margin: 1rem 0 1.5rem;
            backdrop-filter: blur(4px);
        }

        .winner-name {
            color: #FFD966;
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* Start button */
        .btn-start {
            background: #FFD966;
            color: #0b2b1f;
            border: none;
            padding: 16px 36px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
            margin-top: 15px;
        }

        .btn-start:hover {
            background: #ffcd38;
            transform: scale(1.02);
            box-shadow: 0 12px 22px rgba(0, 0, 0, 0.3);
        }

        /* Footer */
        .footer {
            margin-top: 2.8rem;
            font-size: 0.8rem;
            opacity: 0.7;
            color: #ddd;
            border-top: 1px solid rgba(255, 217, 102, 0.3);
            padding-top: 1.5rem;
        }

        @media (max-width: 550px) {
            .hero { padding: 1.8rem 1.2rem; }
            h1 { font-size: 1.8rem; }
            .stat-number { font-size: 2rem; }
            .btn-start { font-size: 1.1rem; padding: 12px 24px; }
        }
    </style>
</head>
<body>
<div class="hero">
    <div class="logo-icon">✝️</div>
    <h1>ትንሣኤ ጥያቄ</h1>
    <div class="sub">የመጽሐፍ ቅዱስ እውቀት ፈተና</div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-number">{{ total }}</div>
            <div class="stat-label">ተሳታፊዎች</div>
        </div>
        <div class="stat-card">
            <div class="stat-number">{{ avg }}</div>
            <div class="stat-label">አማካይ ውጤት /10</div>
        </div>
        <div class="stat-card">
            <div class="stat-number">{{ highest }}</div>
            <div class="stat-label">ከፍተኛ ውጤት /10</div>
        </div>
    </div>

    {% if winner != '—' %}
    <div class="winner-section">
        🏆 እስካሁን አሸናፊ: <span class="winner-name">{{ winner }}</span>
    </div>
    {% else %}
    <div class="winner-section">
        ✨ የመጀመሪያ ተሳታፊ ይሁኑ!
    </div>
    {% endif %}

    <a href="/public-easter-quiz" class="btn-start">
        📖 ውድድሩን ጀምር
    </a>
    <div class="footer">
        ክርስቶስ ተነሥቶአል! 🕊️
    </div>
</div>
</body>
</html>
