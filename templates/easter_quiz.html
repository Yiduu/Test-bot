<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ትንሣኤ ጥያቄ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(135deg,#1e3c2c,#2a4a35);font-family:'Segoe UI',Roboto,sans-serif;padding:20px;color:#f0f0f0}
        .container{max-width:900px;margin:0 auto;background:rgba(255,255,255,0.1);backdrop-filter:blur(4px);border-radius:32px;padding:25px 20px;border:1px solid rgba(255,215,0,0.3)}
        h1{text-align:center;color:#FFD966;margin-bottom:8px}
        .sub{text-align:center;margin-bottom:25px;opacity:0.9}
        .question-card{background:rgba(0,0,0,0.5);border-radius:24px;padding:20px;margin-bottom:20px;border-left:5px solid #FFD966}
        .question-text{font-size:1.2rem;font-weight:600;margin-bottom:15px}
        .options{display:flex;flex-direction:column;gap:12px;margin:15px 0}
        .option{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.08);padding:12px 15px;border-radius:40px;cursor:pointer;transition:0.2s}
        .option:hover{background:rgba(255,217,102,0.2);transform:translateX(5px)}
        .option.selected.correct{background:#2e7d32;border-color:#4caf50}
        .option.selected.wrong{background:#c62828;border-color:#ef5350}
        .option.selected .option-letter{background:#1e3c2c;color:#FFD966}
        .option-letter{background:#FFD966;color:#1e3c2c;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%}
        .feedback{background:rgba(0,0,0,0.7);border-radius:12px;padding:12px;margin-top:10px;font-size:0.9rem}
        .feedback.correct{color:#a5d6a5}
        .feedback.wrong{color:#ffb3b3}
        .scripture{font-size:0.85rem;margin-top:10px;color:#FFD966;text-align:right}
        .nav-buttons{display:flex;justify-content:space-between;margin-top:20px;gap:15px}
        button{background:#FFD966;border:none;padding:12px 24px;border-radius:40px;font-weight:bold;color:#1e3c2c;cursor:pointer;flex:1}
        button:disabled{opacity:0.5}
        .reset-btn{background:#6c757d;color:white}
        .result-area{margin-top:25px;background:#1e3c2c;border-radius:24px;padding:20px;text-align:center}
        .score{font-size:2.5rem;font-weight:bold;color:#FFD966}
        footer{text-align:center;margin-top:25px;font-size:0.8rem;opacity:0.7}
        .next-btn-active{background:#FFD966}
    </style>
</head>
<body>
<div class="container">
    <h1>🕊️ ትንሣኤ ጥያቄ</h1>
    <div class="sub">የመጽሐፍ ቅዱስ እውቀት ፈተና</div>
    <div id="questionsContainer"></div>
    <div class="nav-buttons">
        <button id="prevBtn" disabled>◀ ቀዳሚ</button>
        <button id="nextBtn" disabled style="opacity:0.5;">ቀጣይ ▶</button>
        <button id="submitBtn" style="display:none;">✅ ውጤቴን አሳይ</button>
        <button id="resetBtn" class="reset-btn">⟳ ከመጀመሪያ</button>
    </div>
    <div id="resultArea" style="display:none;"></div>
    <footer>ክርስቶስ ተነሥቶአል! ✝️</footer>
</div>
<script>
    // ---------- 10 Questions (same as before) ----------
    const questions = [
        { text: "መልአኩም መልሶ ሴቶቹን አላቸው፡— እናንተስ አትፍሩ...", options: ["ማርቆስ 16:6","ማቴዎስ 28:5-6","ሉቃስ 24:5","ዮሐንስ 20:15"], correct:1, explanation:"በማቴዎስ ወንጌል", scripture:"ማቴዎስ 28:5-6" },
        { text: "ኢየሱስም፡— ትንሣኤና ሕይወት እኔ ነኝ...", options: ["ዮሐንስ 14:6","ዮሐንስ 11:25","ዮሐንስ 5:24","ዮሐንስ 3:16"], correct:1, explanation:"ኢየሱስ ከማርታ ጋር ተናግሯል", scripture:"ዮሐንስ 11:25" },
        { text: "አሁን ግን ክርስቶስ ... ከሙታን ተነሥቶአል።", options: ["1ኛ ቆሮንቶስ 15:20","2ኛ ቆሮንቶስ 5:17","ሮሜ 6:4","ገላትያ 2:20"], correct:0, explanation:"ጳውሎስ ይህን ያስተምራል", scripture:"1ኛ ቆሮንቶስ 15:20" },
        { text: "ሞቱንም በሚመስል ሞት ከእርሱ ጋር ከተባበርን...", options: ["ሮሜ 8:11","ሮሜ 6:5","ኤፌሶን 2:6","ፊልጵስዩስ 3:10"], correct:1, explanation:"ከሞቱ ጋር ተመሳሳይነት", scripture:"ሮሜ 6:5" },
        { text: "ኢየሱስ ክርስቶስ ከሙታን በመነሣቱ ለሕያው ተስፋ...", options: ["1ኛ ጴጥሮስ 1:3-5","2ኛ ጴጥሮስ 1:4","ያዕቆብ 1:18","1ኛ ዮሐንስ 3:1"], correct:0, explanation:"ሕያው ተስፋ", scripture:"1ኛ ጴጥሮስ 1:3-5" },
        { text: "እንግዲህ ከክርስቶስ ጋር ከተነሣችሁ፥ በላይ ያለውን እሹ።", options: ["ኤፌሶን 1:20","ቆላስይስ 3:1","ዕብራውያን 12:2","ፊልጵስዩስ 2:9"], correct:1, explanation:"ሰማያዊ ነገር ሹ", scripture:"ቆላስይስ 3:1" },
        { text: "እርሱንና የትንሣኤውን ኃይል እንዳውቅ...", options: ["ሮሜ 12:1","1ኛ ቆሮንቶስ 9:24","ፊልጵስዩስ 3:10-11","2ኛ ጢሞቴዎስ 2:11"], correct:2, explanation:"ጳውሎስ ይፈልጋል", scripture:"ፊልጵስዩስ 3:10-11" },
        { text: "ሕያውን ከሙታን መካከል ስለ ምን ትፈልጋላችሁ? ተነሥቶአል...", options: ["ሉቃስ 24:4-6","ማቴዎስ 28:6","ማርቆስ 16:6","ዮሐንስ 20:13"], correct:0, explanation:"ሁለቱ ሰዎች ጠየቁ", scripture:"ሉቃስ 24:4-6" },
        { text: "እግዚአብሔር ግን የሞትን ጣር አጥፍቶ አስነሣው።", options: ["የሐዋርያት ሥራ 2:23-24","የሐዋርያት ሥራ 4:10","የሐዋርያት ሥራ 13:30","ሮሜ 1:4"], correct:0, explanation:"ጴጥሮስ ስብከት", scripture:"የሐዋርያት ሥራ 2:23-24" },
        { text: "ኢየሱስም መልሶ፡— ይህን ቤተ መቅደስ አፍርሱት፥ በሦስት ቀንም አነሣዋለሁ።", options: ["ማቴዎስ 26:61","ማርቆስ 14:58","ዮሐንስ 2:19","ዮሐንስ 10:18"], correct:2, explanation:"ስለ ሰውነቱ ተናገረ", scripture:"ዮሐንስ 2:19" }
    ];

    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let userFeedback = new Array(questions.length).fill(null); // stores { isCorrect, explanation, scripture }
    let answered = new Array(questions.length).fill(false);
    
    let tg = window.Telegram.WebApp;
    tg.expand();
    let user = tg.initDataUnsafe?.user || { id: 'anonymous', first_name: 'Guest', username: 'guest' };
    const userId = user.id.toString();
    const firstName = user.first_name || 'Anonymous';
    const username = user.username || 'no_username';

    const container = document.getElementById('questionsContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultArea = document.getElementById('resultArea');

    function escapeHtml(str) { 
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;});
    }

    function renderCurrentQuestion() {
        const q = questions[currentIndex];
        const hasAnswered = answered[currentIndex];
        const selectedIdx = userAnswers[currentIndex];
        const feedback = userFeedback[currentIndex];
        
        let html = `<div class="question-card"><div class="question-text">${currentIndex+1}. ${escapeHtml(q.text)}</div><div class="options">`;
        q.options.forEach((opt, idx) => {
            const letter = String.fromCharCode(65+idx);
            let additionalClass = '';
            if (hasAnswered && selectedIdx === idx) {
                additionalClass = (idx === q.correct) ? 'correct' : 'wrong';
            }
            const isSelected = (selectedIdx === idx);
            html += `<div class="option ${isSelected ? 'selected ' + additionalClass : ''}" data-opt-index="${idx}">
                        <div class="option-letter">${letter}</div>
                        <div class="option-text">${escapeHtml(opt)}</div>
                    </div>`;
        });
        html += `</div>`;
        
        // Show feedback if answered
        if (hasAnswered && feedback) {
            const feedbackClass = feedback.isCorrect ? 'correct' : 'wrong';
            html += `<div class="feedback ${feedbackClass}">
                        ${feedback.isCorrect ? '✅ ትክክል ነው!' : '❌ ትክክል አይደለም።'}
                        <br>📘 ${escapeHtml(feedback.explanation)}
                        <div class="scripture">📖 መጽሐፍ ቅዱስ: ${feedback.scripture}</div>
                    </div>`;
        }
        html += `</div>`;
        container.innerHTML = html;
        
        // Attach click handlers to options (only if not already answered)
        document.querySelectorAll('.option').forEach(optDiv => {
            optDiv.addEventListener('click', () => {
                if (answered[currentIndex]) {
                    tg.showAlert("ይቅርታ፣ ለዚህ ጥያቄ መልስ አስቀድመህ መርጠሃል። ወደሚቀጥለው ሂድ።");
                    return;
                }
                const chosen = parseInt(optDiv.dataset.optIndex);
                const isCorrect = (chosen === q.correct);
                // Store answer
                userAnswers[currentIndex] = chosen;
                answered[currentIndex] = true;
                userFeedback[currentIndex] = {
                    isCorrect: isCorrect,
                    explanation: q.explanation,
                    scripture: q.scripture
                };
                // Re-render to show feedback
                renderCurrentQuestion();
                // Enable next button
                nextBtn.disabled = false;
                nextBtn.style.opacity = '1';
                // If last question, show submit button instead
                if (currentIndex === questions.length-1) {
                    nextBtn.style.display = 'none';
                    submitBtn.style.display = 'block';
                }
            });
        });
        
        // Update prev button
        prevBtn.disabled = (currentIndex === 0);
        // Update next/submit visibility
        if (currentIndex === questions.length-1) {
            nextBtn.style.display = 'none';
            submitBtn.style.display = answered[currentIndex] ? 'block' : 'none';
        } else {
            nextBtn.style.display = 'block';
            submitBtn.style.display = 'none';
            // Enable next only if current answered
            if (answered[currentIndex]) {
                nextBtn.disabled = false;
                nextBtn.style.opacity = '1';
            } else {
                nextBtn.disabled = true;
                nextBtn.style.opacity = '0.5';
            }
        }
    }

    function goPrev() {
        if (currentIndex > 0) {
            currentIndex--;
            renderCurrentQuestion();
        }
    }
    
    function goNext() {
        if (currentIndex < questions.length-1 && answered[currentIndex]) {
            currentIndex++;
            renderCurrentQuestion();
        }
    }
    
    function calculateScore() {
        let correctCount = 0;
        let results = [];
        for(let i=0;i<questions.length;i++) {
            const isCorrect = (userAnswers[i] === questions[i].correct);
            if(isCorrect) correctCount++;
            results.push({
                userChoice: userAnswers[i]!==null ? questions[i].options[userAnswers[i]] : "አልመለሰም",
                correctAnswer: questions[i].options[questions[i].correct],
                isCorrect: isCorrect,
                explanation: questions[i].explanation,
                scripture: questions[i].scripture
            });
        }
        return { correctCount, total: questions.length, results };
    }
    
    async function showResult() {
        const { correctCount, total, results } = calculateScore();
        let resultHtml = `<div class="score">${correctCount} / ${total}</div>
                          <div>ውጤት: ${Math.round(correctCount/total*100)}%</div><hr>`;
        for(let i=0;i<results.length;i++) {
            const res = results[i];
            resultHtml += `<div style="text-align:left; margin-bottom:15px;">
                            <strong>${i+1}. ${escapeHtml(questions[i].text.substring(0,80))}...</strong><br>
                            ${res.isCorrect ? '✅ ትክክል' : '❌ ስህተት'}<br>
                            መልስህ: ${escapeHtml(res.userChoice)}<br>
                            ትክክለኛው: ${escapeHtml(res.correctAnswer)}<br>
                            <span style="background:rgba(0,0,0,0.3); padding:5px;">📘 ${escapeHtml(res.explanation)} (${res.scripture})</span>
                        </div>`;
        }
        resultArea.innerHTML = resultHtml;
        resultArea.style.display = 'block';
        document.querySelector('.nav-buttons').style.display = 'none';
        
        // Save to server
        const answersArray = userAnswers.map(a => a !== null ? a : -1);
        try {
            await fetch('/api/save-quiz-result', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, first_name: firstName, username: username, score: correctCount, total: total, answers: answersArray })
            });
            const shareBtn = document.createElement('button');
            shareBtn.textContent = '📢 ውጤቴን አጋራ';
            shareBtn.style.marginTop = '15px';
            shareBtn.onclick = () => { tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(`ክርስቶስ ተነሥቶአል! 🎉 ውጤቴ: ${correctCount}/${total} (${Math.round(correctCount/total*100)}%)`)}`); };
            resultArea.appendChild(shareBtn);
            tg.showAlert(`ውጤትህ ተመዝግቧል! ክርስቶስ ተነሥቶአል ✝️`);
        } catch(e) { console.error(e); }
    }
    
    function resetQuiz() {
        userAnswers.fill(null);
        answered.fill(false);
        userFeedback.fill(null);
        currentIndex = 0;
        resultArea.style.display = 'none';
        document.querySelector('.nav-buttons').style.display = 'flex';
        nextBtn.style.display = 'block';
        submitBtn.style.display = 'none';
        renderCurrentQuestion();
    }
    
    prevBtn.addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);
    submitBtn.addEventListener('click', showResult);
    resetBtn.addEventListener('click', resetQuiz);
    
    renderCurrentQuestion();
</script>
</body>
</html>
